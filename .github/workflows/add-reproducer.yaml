# Tries to reproduce a newly-opened bug report, and comments with the
# reproducer when it succeeds. `.github/add-reproducer/README.md` describes
# the pipeline, including why most runs stay silent.
#
# The reproduce job runs commands derived from the issue body, so it gets no
# secrets and no write access. The model calls happen before it, in `plan`,
# which holds the OpenRouter key and runs nothing from the issue; posting
# happens after it, in `post`, which only has `issues: write`.
name: add-reproducer

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to try to reproduce.
        required: true
        type: string
      repository:
        description: The owner/name the issue lives in.
        required: true
        default: canonical/operator
        type: string
      post_comment:
        description: Post the comment for real, instead of only logging it.
        required: false
        default: false
        type: boolean

permissions: {}

env:
  # `false` runs the whole pipeline on new issues but only logs the comment.
  POST_COMMENTS: 'true'
  ISSUE: ${{ github.event_name == 'workflow_dispatch' && inputs.issue || github.event.issue.number }}
  REPO: ${{ github.event_name == 'workflow_dispatch' && inputs.repository || github.repository }}

jobs:
  plan:
    runs-on: ubuntu-latest
    # Holds OPENROUTER_API_KEY.
    environment: llm
    permissions:
      contents: read
      issues: read
    timeout-minutes: 10
    outputs:
      planned: ${{ steps.plan.outputs.planned }}
      post: ${{ (github.event_name == 'workflow_dispatch' && inputs.post_comment) || (github.event_name == 'issues' && env.POST_COMMENTS == 'true') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # The same Python as the reproduce job, so a model-written test file
      # is checked against the interpreter it will run on.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: '3.12'
          enable-cache: false
      - name: Plan the reproduction
        id: plan
        working-directory: .github/add-reproducer/harness
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          POST: ${{ (github.event_name == 'workflow_dispatch' && inputs.post_comment) || (github.event_name == 'issues' && env.POST_COMMENTS == 'true') }}
        run: |
          set -ueo pipefail
          skip=()
          if [ "$POST" = "true" ]; then
            skip=(--skip-if-commented)
          fi
          uv run python ../run.py plan --repo "$REPO" --issue "$ISSUE" --out-dir "$PWD/out" "${skip[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: add-reproducer-plan
          if-no-files-found: ignore
          path: .github/add-reproducer/harness/out/*.json

  reproduce:
    needs: plan
    if: needs.plan.outputs.planned == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # A backstop against a hung juju command.
    timeout-minutes: 30
    outputs:
      composed: ${{ steps.execute.outputs.composed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # No cache: this job runs code from the issue, and a cache it saved
      # would be restored into other workflows on the default branch.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: '3.12'
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: add-reproducer-plan
          path: .github/add-reproducer/harness/plan
      # `--out-dir` is absolute because the charm directory built under it is
      # embedded in `juju deploy`, and juju 4 rejects a relative local-charm
      # path that is not `./`-prefixed.
      - name: Try to reproduce the issue
        id: execute
        working-directory: .github/add-reproducer/harness
        run: |
          set -ueo pipefail
          uv run python ../run.py execute --plan "plan/$ISSUE-plan.json" --out-dir "$PWD/out"
      # The run record and the composed comment, but not the scratch
      # directory underneath them, which holds a packed charm.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: add-reproducer-run
          if-no-files-found: ignore
          path: |
            .github/add-reproducer/harness/out/*.json
            .github/add-reproducer/harness/out/*.md

  post:
    needs: [plan, reproduce]
    if: needs.plan.outputs.post == 'true' && needs.reproduce.outputs.composed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: '3.12'
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: add-reproducer-run
          path: .github/add-reproducer/harness/run
      # The comment comes from the reproduce job, which the issue's author
      # can control, so it only ever goes to the issue this run is for.
      - name: Post the comment
        working-directory: .github/add-reproducer/harness
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -ueo pipefail
          uv run python ../run.py post --repo "$REPO" --issue "$ISSUE" --comment "run/$ISSUE.md"
