name: Dogfood canary

# FORK-ONLY. Never merge this upstream, and never branch a PR from a fork
# main that has it. It exists to drive the ai-failure-notifications pair
# (notify-scheduled-failure.yaml -> ai-failure-enrich.yaml) end to end in
# seconds, instead of waiting ~50 minutes on a real scheduled workflow that
# also needs secrets a fork does not have.
#
# It stands in for one of the seven real callers, so it reproduces the real
# nesting depth: this workflow -> the notifier -> the enricher.
#
# Real callers gate on `failure() && github.event_name == 'schedule'`; this
# one drops the event half so it can be dispatched. Nothing downstream
# inspects the event, so there is no `schedule`-only gate left to widen.
#
# It also runs on push to its own branch. Every workflow in the chain is
# `workflow_call`, so nothing here needs to sit on the default branch: a
# push to this branch is the whole run. Note that the enricher skips a run
# id it has already stamped, so each iteration needs a fresh commit.

on:
  push:
    branches:
      - dogfood-canary-wait-status
  workflow_dispatch:
    inputs:
      shape:
        description: Which failure shape to emit.
        type: choice
        options:
          - pytest
          - traceback-only
          - infra-only
          - import-error
          - jubilant-wait-timeout
        default: jubilant-wait-timeout

permissions: {}

jobs:
  canary:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Emit a realistic failure
        env:
          # `inputs.shape` is empty on a push, so default it here: an
          # unmatched `case` emits nothing at all, and an empty log is not
          # a signature worth testing against.
          #
          # The default is whichever shape nothing in the fork's issues
          # already matches. A shape this repo has seen before makes the
          # enricher comment on the old issue, which never exercises the
          # create path -- so change this when the current default has an
          # issue of its own.
          SHAPE: ${{ inputs.shape || 'jubilant-wait-timeout' }}
        run: |
          case "$SHAPE" in
            jubilant-wait-timeout)
