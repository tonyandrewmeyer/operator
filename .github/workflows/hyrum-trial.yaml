# Trial run of canonical/hyrum over the charms in published-charms-tests.yaml,
# to judge whether hyrum can replace that workflow. Each shard runs the unit
# and static targets twice: once as the charms pin ops (the baseline), and once
# with ops from this checkout. `hyrum compare` then reports only the charms
# that pass on their own ops and fail on ours.

name: Broad Charm Compatibility Tests (hyrum trial)

on:
  workflow_dispatch:

permissions: {}

env:
  HYRUM_VERSION: '1.0.0b1'
  SHARD_COUNT: 6

jobs:
  hyrum:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      SHARD: ${{ matrix.shard }}
      HYRUM_CHARMS: ${{ github.workspace }}/charms
      RESULTS: ${{ github.workspace }}/results
      LOGS: ${{ github.workspace }}/logs
    steps:
      - name: Checkout the operator repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          path: operator
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      # The build tools and headers that hyrum's README lists, so that charms
      # with C or Rust extensions build rather than failing on the host.
      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libffi-dev libpq-dev \
            libmariadb-dev python3-dev

      - name: Install hyrum and the charm tooling
        run: |
          uv tool install "hyrum==${HYRUM_VERSION}"
          uv tool install tox~=4.2 --with tox-uv~=1.29
          uv tool install poetry~=2.0
          uv tool install 'coverage[toml]'

      # Use the same charms as published-charms-tests.yaml, so the results can
      # be compared with that workflow's latest run.
      - name: Build this shard's charm list
        run: |
          set -euo pipefail
          echo 'Team,Repository,Branch (if not the default),Source' > charms.csv
          grep -oP 'charm-repo: \K\S+' operator/.github/workflows/published-charms-tests.yaml \
            | sort -u \
            | awk -v n="$SHARD_COUNT" -v i="$SHARD" '(NR - 1) % n == i' \
            | sed 's|^\(.*\)$|Charm Tech,https://github.com/\1,,manual|' >> charms.csv
          cat charms.csv

      - name: Clone the charms
        run: |
          mkdir -p "$RESULTS" "$LOGS"
          hyrum get-charms --source charms.csv --dest "$HYRUM_CHARMS"

      # Clean between runs so that no tox or uv environment built against one
      # ops carries over into the next run, and to stay within the runner's disk.
      # The patched runs take ops from git rather than the local checkout: hyrum
      # installs a local path as editable, and Pyright can't follow the import
      # hook that a setuptools editable install uses.
      - name: Run unit tests with the charms' own ops
        if: ${{ !cancelled() }}
        run: |
          hyrum check unit --no-patch --workers 3 --verbose --no-fail \
            --save "$RESULTS/baseline-unit.json" --log-dir "$LOGS/baseline-unit"
          hyrum clean --quiet

      - name: Run unit tests with this ops
        if: ${{ !cancelled() }}
        run: |
          hyrum check unit --patch "ops @ git+https://github.com/$GITHUB_REPOSITORY@$GITHUB_SHA" --workers 3 --verbose \
            --no-fail --save "$RESULTS/patched-unit.json" --log-dir "$LOGS/patched-unit"
          hyrum clean --quiet

      - name: Run static checks with the charms' own ops
        if: ${{ !cancelled() }}
        run: |
          hyrum check static --no-patch --workers 3 --verbose --no-fail \
            --save "$RESULTS/baseline-static.json" --log-dir "$LOGS/baseline-static"
          hyrum clean --quiet

      - name: Run static checks with this ops
        if: ${{ !cancelled() }}
        run: |
          hyrum check static --patch "ops @ git+https://github.com/$GITHUB_REPOSITORY@$GITHUB_SHA" --workers 3 --verbose \
            --no-fail --save "$RESULTS/patched-static.json" --log-dir "$LOGS/patched-static"

      - name: Compare with the baseline
        if: ${{ !cancelled() }}
        run: |
          set +e -uo pipefail
          status=0
          for target in unit static; do
            echo "## Shard ${SHARD}: ${target}" >> "$GITHUB_STEP_SUMMARY"
            hyrum compare --format markdown --fail-on-regression \
              "$RESULTS/baseline-${target}.json" "$RESULTS/patched-${target}.json" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            rc="${PIPESTATUS[0]}"
            if [ "$rc" -gt "$status" ]; then
              status="$rc"
            fi
          done
          exit "$status"

      - name: Upload results and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: hyrum-shard-${{ matrix.shard }}
          path: |
            charms.csv
            results/
            logs/
          if-no-files-found: warn
