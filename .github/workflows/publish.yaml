---
name: Publish

# Publishing a release is what puts the packages on PyPI. This workflow used
# to fire on a pushed tag matching `[1-3].*`, which made the publish a side
# effect of GitHub creating the tag when somebody published a draft release.
# The cause is named here instead, and the test-publish workflow has been
# folded in as the manual job below.
#
# Three things are worth knowing:
#
# - Trusted publishing is configured on PyPI against this file's *name*. The
#   Test PyPI publisher was configured against `test-publish.yaml`, which no
#   longer exists, so it has to be pointed at `publish.yaml` before the
#   manual job can work again.
# - The `[1-3].*` tag pattern is gone with the trigger, and nothing replaces
#   it: any published release publishes. That is deliberate - it was an
#   incidental bound rather than a check - and what is left in front of PyPI
#   is a human publishing the draft release and the `publish-pypi`
#   environment.
# - `published` rather than `released`, so that a pre-release publishes too.
#   3.4.0b1, 3.4.0b2 and 3.4.0b3 all went to PyPI under the old tag pattern,
#   and `released` would silently stop that.

"on":
  release:
    types: [published]
  # Build and publish to Test PyPI instead. Dispatch it from whichever branch
  # or tag you want built.
  workflow_dispatch:

permissions: {}

# One publish at a time per release, and one manual run at a time. Two runs
# would build the same thing and race each other to the index.
concurrency:
  group: publish-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # To mint the trusted-publishing token for PyPI.
      attestations: write  # To attest the built artefacts.
      contents: read
    environment: publish-pypi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # The commit the release's tag points at, named rather than left to
          # whatever the event's default checkout would be.
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: false
      - run: uv build --all
      - name: Test if built package versions and dependency versions match
        run: |
          set -xueo pipefail
          uvx --with "$(echo -n dist/ops-*.whl)[testing,tracing]" --with dist/ops_scenario-*.whl --with dist/ops_tracing-*.whl python -c 'import ops, scenario, ops_tracing; print("OK")'
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: 'dist/*'
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1

  test-build-and-publish:
    name: Build and publish to Test PYPI
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # To mint the trusted-publishing token for Test PyPI.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: false
      - run: uv build --all
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  secscan:
    if: ${{ github.event_name == 'release' }}
    uses: ./.github/workflows/sbom-secscan.yaml
