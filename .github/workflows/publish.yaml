---
name: Publish

# Publishing a release is what puts the packages on PyPI. The manual job
# below builds and publishes to Test PyPI instead.
#
# Worth knowing:
#
# - Trusted publishing on PyPI and Test PyPI is tied to this file's name.
# - Every published release goes to PyPI. The checks are a human publishing
#   the draft and the `publish-pypi` environment.
# - `published` rather than `released`, so pre-releases publish too.

on:
  release:
    types: [published]
  # Build and publish to Test PyPI instead. Dispatch it from whichever branch
  # or tag you want built.
  workflow_dispatch:

permissions: {}

# One publish at a time per release, and one manual run at a time. Two runs
# would build the same thing and race each other to the index.
concurrency:
  group: publish-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # To mint the trusted-publishing token for PyPI.
      attestations: write  # To attest the built artefacts.
      contents: read
    environment: publish-pypi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The commit the release's tag points at, named rather than left to
          # whatever the event's default checkout would be.
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false
      # "Propose a release" checks this as well, but a version can be changed by
      # hand.
      - name: Check that the runner is built from a Juju release
        run: grep -qE '^const JujuTag = "[^"]+"$' scriptlets/runner/main.go
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: scriptlets/runner/go.mod
          cache: false
      # ops-testing-scriptlets has a wheel per platform, so it isn't built with
      # the others.
      - run: |
          set -xueo pipefail
          for package in ops ops-scenario ops-tracing; do
            uv build --package "$package"
          done
          scriptlets/scripts/build-wheels.sh dist
      - name: Test if built package versions and dependency versions match
        run: |
          set -xueo pipefail
          uvx --with "$(echo -n dist/ops-*.whl)[testing,tracing]" --with dist/ops_scenario-*.whl --with dist/ops_tracing-*.whl --with dist/ops_testing_scriptlets-*manylinux*x86_64*.whl python -c 'import ops, scenario, ops_tracing, scriptlet_testing; print("OK")'
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: 'dist/*'
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  test-build-and-publish:
    name: Build and publish to Test PyPI
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # To mint the trusted-publishing token for Test PyPI.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: scriptlets/runner/go.mod
          cache: false
      # ops-testing-scriptlets has a wheel per platform, so it isn't built with
      # the others.
      - run: |
          set -xueo pipefail
          for package in ops ops-scenario ops-tracing; do
            uv build --package "$package"
          done
          scriptlets/scripts/build-wheels.sh dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  secscan:
    if: ${{ github.event_name == 'release' }}
    uses: $/.github/workflows/sbom-secscan.yaml
