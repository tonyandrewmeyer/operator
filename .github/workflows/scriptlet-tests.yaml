name: Scriptlet Tests

on:
  push:
    branches:
      - main
    paths:
      - 'scriptlets/**'
      - '.github/workflows/scriptlet-tests.yaml'
  pull_request:
    paths:
      - 'scriptlets/**'
      - '.github/workflows/scriptlet-tests.yaml'
  workflow_dispatch:

permissions: {}

jobs:
  go:
    name: Runner (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scriptlets/runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: scriptlets/runner/go.mod
          cache-dependency-path: scriptlets/runner/go.sum
      - run: go vet ./...
      - run: go test ./...
      - name: Cross-compile for every wheel platform
        env:
          CGO_ENABLED: '0'
        run: |
          set -xueo pipefail
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -trimpath -o /dev/null .
          done

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv tool install tox --with tox-uv
      - run: cd scriptlets && tox -e lint

  unit:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: scriptlets/runner/go.mod
          cache-dependency-path: scriptlets/runner/go.sum
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv tool install tox --with tox-uv
      - run: uv python install ${{ matrix.python-version }}
      # The tests build the runner (native and wasip1) from the checkout.
      - run: cd scriptlets && tox -e py${{ matrix.python-version }}-unit

  build-wheels:
    name: Build the wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: scriptlets/runner/go.mod
          cache-dependency-path: scriptlets/runner/go.sum
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      # The same script that the Publish workflow runs, so the wheels tested
      # below are built as the published ones are.
      - name: Build the sdist and wheels
        run: scriptlets/scripts/build-wheels.sh dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: scriptlet-wheels
          path: dist/
          retention-days: 7

  wheel:
    name: Wheel (${{ matrix.platform }})
    needs: build-wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
            tag: manylinux_2_17_x86_64.manylinux2014_x86_64.musllinux_1_1_x86_64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            tag: manylinux_2_17_aarch64.manylinux2014_aarch64.musllinux_1_1_aarch64
          - os: macos-latest
            platform: darwin-arm64
            tag: macosx_12_0_arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: scriptlet-wheels
          path: dist

      - name: Install the platform's wheel in a fresh environment
        env:
          TAG: ${{ matrix.tag }}
        run: |
          set -xueo pipefail
          wheel="dist/ops_testing_scriptlets-$(uv version --package ops-testing-scriptlets --short)-py3-none-$TAG.whl"
          test -f "$wheel"
          uv venv --python 3.12 .wheel-venv
          uv pip install --python .wheel-venv "$wheel" 'pytest~=9.0'

      # SCRIPTLET_TESTING_BUNDLED makes the tests use the wheel's runner
      # rather than building one from the checkout.
      - name: Run the tests against the installed wheel
        env:
          SCRIPTLET_TESTING_BUNDLED: '1'
        run: cd scriptlets && ../.wheel-venv/bin/python -m pytest -v

      - name: Measure the fixtures' steps and allocations
        env:
          PLATFORM: ${{ matrix.platform }}
        run: .wheel-venv/bin/python scriptlets/scripts/measure_fixtures.py measure "budgets-$PLATFORM.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: scriptlet-budgets-${{ matrix.platform }}
          path: budgets-${{ matrix.platform }}.json
          retention-days: 7

  compare-budgets:
    name: Compare budgets across platforms
    needs: wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: scriptlet-budgets-*
          merge-multiple: true
      # Steps must match linux/amd64 exactly, so a difference fails. Allocations
      # are starlark's estimate, so a difference is recorded in the summary
      # but doesn't fail.
      - name: Compare with linux/amd64
        run: |
          set -xueo pipefail
          python3 scriptlets/scripts/measure_fixtures.py compare \
            budgets-linux-amd64.json budgets-linux-arm64.json budgets-darwin-arm64.json \
            | tee -a "$GITHUB_STEP_SUMMARY"
