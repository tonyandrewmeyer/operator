[project]
name = "scriptlet-testing"
version = "0.0.1.dev0"
description = "Unit-test Juju scriptlet (unitless) charms with Juju's own executor (prototype)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
pytest = ["pytest>=8.1"]
wasm = ["wasmtime>=36"]

[project.entry-points.pytest11]
scriptlet_testing = "scriptlet_testing.plugin"

[dependency-groups]
dev = ["pytest>=8.1", "pyright", "ruff", "wasmtime>=36"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scriptlet_testing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "pytester"]

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "Q"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.pyright]
include = ["src", "tests", "benchmarks"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
reportPrivateUsage = false

[tool.ruff.lint.per-file-ignores]
# The mutation table holds long exact source snippets.
"benchmarks/mutate.py" = ["E501"]
