[tox]
requires = tox>=4.2
env_list = lint, unit
skip_missing_interpreters = true

[testenv]
runner = uv-venv-lock-runner
setenv =
  PY_COLORS=1
passenv =
  HOME
  PATH
  # The unit tests build the runner with Go unless one of these names a runner.
  SCRIPTLET_TESTING_RUNNER
  SCRIPTLET_TESTING_RUNNER_WASM
  GOTOOLCHAIN
  GOPATH
  GOCACHE
  GOMODCACHE
  GOFLAGS
  GOPROXY

[testenv:py{3.10,3.12,3.14}-unit]
runner = uv-venv-lock-runner
base = unit

[testenv:unit]
description = Run the unit tests (needs Go to build the runner)
dependency_groups = unit
commands = pytest {posargs}

[testenv:lint]
description = Check code style and type correctness
dependency_groups = lint, unit
commands =
    ruff check --preview
    ruff format --preview --check
    codespell
    pyright {posargs}

[testenv:format]
description = Apply coding style standards to code
dependency_groups = lint
commands =
    ruff format --preview
    ruff check --preview --fix
